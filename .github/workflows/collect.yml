name: Collect V2Ray Configs

on:
  schedule:
    - cron: "0 */3 * * *"   # fallback: every 3 hours via GitHub scheduler
  workflow_dispatch:          # manual trigger + self-trigger after each run

permissions:
  contents: write
  actions: write              # needed to re-trigger itself

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx

      - name: Run collector
        run: python collector.py

      - name: Commit & push updated configs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "chore: update configs [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

      - name: Schedule next run in 1 hour
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/collect.yml/dispatches \
            -d '{"ref":"main"}' \
            --retry 3 --retry-delay 5
          echo "✅ Next run queued"
